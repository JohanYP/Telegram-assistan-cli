[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tgvoice"
version = "0.1.0"
description = "Cliente CLI con wake word para hablar con tu bot de Telegram"
requires-python = ">=3.10,<3.13"
dependencies = [
    "telethon>=1.36",
    # openwakeword se instala aparte con --no-deps porque arrastra tflite-runtime,
    # que no tiene wheels para Python >=3.12. Usamos ONNX como inference framework,
    # así que no necesitamos tflite. Pre-instalamos sus otras deps a continuación.
    "onnxruntime>=1.16",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "tqdm>=4.0",
    "requests>=2.0",
    "sounddevice>=0.4.6",
    "numpy>=1.24,<2.0",
    "webrtcvad-wheels>=2.0.14",
    "rich>=13.7",
    "prompt_toolkit>=3.0.43",
    "python-dotenv>=1.0",
]

[project.scripts]
tgvoice = "tgvoice.__main__:run"

[tool.setuptools.packages.find]
where = ["src"]
